name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install tooling
        run: python -m pip install ruff==0.16.5 basedpyright==1.40.2 -r requirements.txt

      - name: Rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: Ruff
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: Basedpyright
        run: basedpyright --warnings plot.py

      - name: Prettier
        run: npx --yes prettier@3.9.6 --check .

  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Tests
        run: cargo test --locked

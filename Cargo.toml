[package]
name = "mood"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Log mood scores and review them in the terminal or as a chart"
license = "MIT"
repository = "https://github.com/MattFor/mood"
readme = "README.md"
keywords = ["mood", "tracker", "tui", "cli", "journal"]
categories = ["command-line-utilities"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
